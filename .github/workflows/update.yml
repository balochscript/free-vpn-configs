name: Update Free VPN Configs

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'configs/**'
      - '.github/workflows/**'

jobs:
  update-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
      
      - name: Install Xray-core
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o -q Xray-linux-64.zip
          sudo mv xray /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray
          rm -f Xray-linux-64.zip geoip.dat geosite.dat LICENSE README.md
          xray version
      
      - name: 📡 Scrape Telegram channels
        env:
          PYROGRAM_SESSION: ${{ secrets.PYROGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          cd src
          python scraper.py
          
          if [ ! -f ../raw_configs.json ]; then
            echo "[]" > ../raw_configs.json
          fi
          
          COUNT=$(jq length ../raw_configs.json)
          echo "SCRAPED_COUNT=$COUNT" >> $GITHUB_ENV
          echo "📥 Scraped: $COUNT configs"
      
      - name: 🆕 Extract recent 100 configs
        run: |
          cd src
          python recent_configs.py
      
      - name: ⚡ Test 1 - TCPing (Fast)
        if: env.SCRAPED_COUNT > 0
        env:
          TEST_TYPE: tcping
        run: |
          cd src
          timeout 15m python tester.py || echo "⏱️ Test timeout"
          
          if [ ! -f ../tested_tcping.json ]; then
            echo "[]" > ../tested_tcping.json
          fi
          
          COUNT=$(jq '[.[] | select(.alive == true)] | length' ../tested_tcping.json)
          echo "TCPING_COUNT=$COUNT" >> $GITHUB_ENV
          echo "⚡ TCPing: $COUNT"
      
      - name: 🟢 Test 2 - Alive (HTTP)
        if: env.SCRAPED_COUNT > 0
        env:
          TEST_TYPE: alive
        run: |
          cd src
          timeout 20m python tester.py || echo "⏱️ Test timeout"
          
          if [ ! -f ../tested_alive.json ]; then
            echo "[]" > ../tested_alive.json
          fi
          
          COUNT=$(jq '[.[] | select(.alive == true)] | length' ../tested_alive.json)
          echo "ALIVE_COUNT=$COUNT" >> $GITHUB_ENV
          echo "🟢 Alive: $COUNT"
      
      - name: 📦 Test 3 - Volume (GitHub)
        if: env.SCRAPED_COUNT > 0
        env:
          TEST_TYPE: volume
        run: |
          cd src
          timeout 25m python tester.py || echo "⏱️ Test timeout"
          
          if [ ! -f ../tested_volume.json ]; then
            echo "[]" > ../tested_volume.json
          fi
          
          COUNT=$(jq '[.[] | select(.has_volume == true)] | length' ../tested_volume.json)
          echo "VOLUME_COUNT=$COUNT" >> $GITHUB_ENV
          echo "📦 Volume: $COUNT"
      
      - name: 🇮🇷 Test 4 - Iran (Bertina)
        if: env.SCRAPED_COUNT > 0
        env:
          TEST_TYPE: iran
        run: |
          cd src
          timeout 20m python tester.py || echo "⏱️ Test timeout"
          
          if [ ! -f ../tested_iran.json ]; then
            echo "[]" > ../tested_iran.json
          fi
          
          COUNT=$(jq '[.[] | select(.has_volume == true)] | length' ../tested_iran.json)
          echo "IRAN_COUNT=$COUNT" >> $GITHUB_ENV
          echo "🇮🇷 Iran: $COUNT"
      
      - name: 📦 Generate subscription files
        run: |
          cd src
          python utils.py
      
      - name: 🚀 Prepare deployment
        run: |
          mkdir -p deploy
          
          for file in subscription-tcping.txt subscription-alive.txt subscription-volume.txt subscription-iran.txt subscription-recent.txt index.html; do
            if [ -f src/$file ]; then
              cp src/$file deploy/
              echo "✅ Copied $file"
            fi
          done
          
          cat > deploy/stats.json << EOF
          {
            "last_update": "$(date -u '+%Y-%m-%d %H:%M:%S UTC')",
            "scraped": ${SCRAPED_COUNT:-0},
            "tcping": ${TCPING_COUNT:-0},
            "alive": ${ALIVE_COUNT:-0},
            "volume": ${VOLUME_COUNT:-0},
            "iran": ${IRAN_COUNT:-0},
            "recent": 100
          }
          EOF
          
          echo "📊 Deploy folder:"
          ls -lah deploy/
      
      - name: 📤 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
          commit_message: '🔄 Update: ${{ env.TCPING_COUNT }} tcping, ${{ env.ALIVE_COUNT }} alive, ${{ env.VOLUME_COUNT }} volume, ${{ env.IRAN_COUNT }} iran'
      
      - name: 📊 Build summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 📊 Update Summary
          
          **🕐 Time:** $(date -u '+%Y-%m-%d %H:%M UTC')
          
          ### 📈 Statistics
          
          | Type | Count | Description |
          |------|-------|-------------|
          | 📥 Scraped | ${SCRAPED_COUNT:-0} | Total configs from Telegram |
          | ⚡ TCPing | ${TCPING_COUNT:-0} | TCP connection only (fastest) |
          | 🟢 Alive | ${ALIVE_COUNT:-0} | HTTP connection test |
          | 📦 Volume | ${VOLUME_COUNT:-0} | Downloaded 50KB+ from GitHub |
          | 🇮🇷 Iran | ${IRAN_COUNT:-0} | Downloaded 80KB+ from Bertina (Iran DNS) |
          | 🆕 Recent | 100 | Latest configs (no filter) |
          
          ### 🔗 Subscription Links
          
          **⚡ TCPing (Fastest - TCP only):**
          \`\`\`
          https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/subscription-tcping.txt
          \`\`\`
          
          **🟢 Alive (Fast - HTTP test):**
          \`\`\`
          https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/subscription-alive.txt
          \`\`\`
          
          **📦 Volume (Quality - GitHub download):**
          \`\`\`
          https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/subscription-volume.txt
          \`\`\`
          
          **🇮🇷 Iran (Best for Iran - Bertina DNS):**
          \`\`\`
          https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/subscription-iran.txt
          \`\`\`
          
          **🆕 Recent 100 (Untested - Latest):**
          \`\`\`
          https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/subscription-recent.txt
          \`\`\`
          
          **🌐 Web Interface:**
          https://${{ github.repository_owner }}.github.io/free-vpn-configs/
          
          ---
          
          ✅ **All tests completed successfully!**
          EOF

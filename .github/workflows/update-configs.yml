name: Update Free VPN Configs

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
      
      - name: Cache Xray binary
        id: cache-xray
        uses: actions/cache@v3
        with:
          path: /usr/local/bin/xray
          key: xray-latest
      
      - name: Install Xray
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o -q Xray-linux-64.zip
          sudo mv xray /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray
          rm -f Xray-linux-64.zip geoip.dat geosite.dat LICENSE README.md
      
      - name: Verify Xray installation
        run: |
          xray version
      
      - name: Scrape Telegram channels
        env:
          PYROGRAM_SESSION: ${{ secrets.PYROGRAM_SESSION }}
        run: |
          cd src
          timeout 10m python scraper.py || echo "Scraper timeout"
          
          if [ ! -f ../raw_configs.json ]; then
            echo "[]" > ../raw_configs.json
          fi
          
          COUNT=$(jq length ../raw_configs.json)
          echo "📥 Scraped: $COUNT configs"
          echo "SCRAPED_COUNT=$COUNT" >> $GITHUB_ENV
      
      - name: Test configs
        if: env.SCRAPED_COUNT > 0
        run: |
          cd src
          timeout 15m python tester.py || echo "Tester timeout"
          
          if [ ! -f ../working_configs.json ]; then
            echo "[]" > ../working_configs.json
          fi
          
          COUNT=$(jq length ../working_configs.json)
          echo "✅ Working: $COUNT configs"
          echo "WORKING_COUNT=$COUNT" >> $GITHUB_ENV
      
      - name: Generate subscription
        if: env.WORKING_COUNT > 0
        run: |
          cd src
          python utils.py
          echo "✅ Generated subscription file"
      
      - name: Prepare deployment
        run: |
          mkdir -p deploy
          mv subscription.txt deploy/ 2>/dev/null || echo "No subscription.txt"
          mv index.html deploy/ 2>/dev/null || echo "No index.html"
          echo "Last update: $(date '+%Y-%m-%d %H:%M:%S UTC')" > deploy/last_update.txt
          echo "Working configs: ${WORKING_COUNT:-0}" >> deploy/last_update.txt
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
          commit_message: '🔄 Auto-update configs'
      
      - name: Summary
        run: |
          echo "## 📊 Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🕐 Time: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- 📥 Scraped: ${SCRAPED_COUNT:-0}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Working: ${WORKING_COUNT:-0}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Subscription Link:" >> $GITHUB_STEP_SUMMARY
          echo "https://balochscript.github.io/free-vpn-configs/subscription.txt" >> $GITHUB_STEP_SUMMARY

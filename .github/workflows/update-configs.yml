name: Update Free VPN Configs

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'configs/**'
      - '.github/workflows/**'

jobs:
  update-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
      
      - name: Cache Xray binary
        id: cache-xray
        uses: actions/cache@v3
        with:
          path: /usr/local/bin/xray
          key: xray-latest
      
      - name: Install Xray-core
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o -q Xray-linux-64.zip
          sudo mv xray /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray
          rm -f Xray-linux-64.zip geoip.dat geosite.dat LICENSE README.md
      
      - name: Verify Xray installation
        run: xray version
      
      - name: Scrape Telegram channels
        env:
          PYROGRAM_SESSION: ${{ secrets.PYROGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}        # ✅ اضافه شد
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}    # ✅ اضافه شد
        run: |
          cd src
          timeout 10m python scraper.py || echo "⚠️ Scraper timeout"
          
          if [ ! -f ../raw_configs.json ]; then
            echo "[]" > ../raw_configs.json
          fi
          
          COUNT=$(jq length ../raw_configs.json)
          echo "📥 Scraped: $COUNT configs"
          echo "SCRAPED_COUNT=$COUNT" >> $GITHUB_ENV
      
      - name: Test configs for volume
        if: env.SCRAPED_COUNT > 0
        run: |
          cd src
          timeout 15m python tester.py || echo "⚠️ Tester timeout"
          
          if [ ! -f ../working_configs.json ]; then
            echo "[]" > ../working_configs.json
          fi
          
          COUNT=$(jq length ../working_configs.json)
          echo "✅ Working: $COUNT configs"
          echo "WORKING_COUNT=$COUNT" >> $GITHUB_ENV
      
      - name: Create empty configs if no scrape
        if: env.SCRAPED_COUNT == 0
        run: |
          echo "[]" > working_configs.json
          echo "WORKING_COUNT=0" >> $GITHUB_ENV
      
      - name: Generate subscription files
        run: |
          cd src
          python utils.py
          echo "✅ Generated subscription and HTML files"
      
      - name: Prepare deployment folder
        run: |
          mkdir -p deploy
          
          if [ -f src/subscription.txt ]; then
            cp src/subscription.txt deploy/
            echo "✅ Copied subscription.txt"
          else
            echo "⚠️ subscription.txt not found"
          fi
          
          if [ -f src/subscription-all.txt ]; then
            cp src/subscription-all.txt deploy/
            echo "✅ Copied subscription-all.txt"
          else
            echo "⚠️ subscription-all.txt not found"
          fi
          
          if [ -f src/index.html ]; then
            cp src/index.html deploy/
            echo "✅ Copied index.html"
          else
            echo "⚠️ index.html not found"
          fi
          
          echo "Last update: $(date '+%Y-%m-%d %H:%M:%S UTC')" > deploy/last_update.txt
          echo "Scraped configs: ${SCRAPED_COUNT:-0}" >> deploy/last_update.txt
          echo "Working configs: ${WORKING_COUNT:-0}" >> deploy/last_update.txt
          
          echo ""
          echo "📦 Deploy folder contents:"
          ls -lah deploy/
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
          commit_message: '🔄 Update configs - ${{ env.SCRAPED_COUNT }} scraped, ${{ env.WORKING_COUNT }} working'
      
      - name: Build summary
        run: |
          echo "## 📊 Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🕐 Time: $(date '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- 📥 Scraped: ${SCRAPED_COUNT:-0} configs" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Working: ${WORKING_COUNT:-0} configs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${WORKING_COUNT:-0}" -gt 0 ]; then
            echo "### 🔗 Subscription Links" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**With Volume (Recommended):**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/subscription.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**All Alive Configs:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/subscription-all.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Web Interface:**" >> $GITHUB_STEP_SUMMARY
            echo "https://${{ github.repository_owner }}.github.io/free-vpn-configs/" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No working configs found in this run" >> $GITHUB_STEP_SUMMARY
          fi

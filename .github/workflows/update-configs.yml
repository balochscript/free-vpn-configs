name: Update Free VPN Configs

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'configs/**'

jobs:
  update-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
      
      - name: Cache Xray
        id: cache-xray
        uses: actions/cache@v3
        with:
          path: /usr/local/bin/xray
          key: xray-latest
      
      - name: Install Xray
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o -q Xray-linux-64.zip
          sudo mv xray /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray
          rm -f Xray-linux-64.zip geoip.dat geosite.dat LICENSE README.md
      
      - name: Verify Xray
        run: xray version
      
      - name: Scrape configs
        env:
          PYROGRAM_SESSION: ${{ secrets.PYROGRAM_SESSION }}
        run: |
          cd src
          timeout 10m python scraper.py || echo "Scraper timeout"
          cd ..
          
          if [ ! -f raw_configs.json ]; then
            echo "[]" > raw_configs.json
          fi
          
          COUNT=$(jq length raw_configs.json)
          echo "📥 Scraped: $COUNT configs"
          echo "SCRAPED_COUNT=$COUNT" >> $GITHUB_ENV
      
      - name: Test configs
        if: env.SCRAPED_COUNT > 0
        run: |
          cd src
          timeout 15m python tester.py || echo "Tester timeout"
          cd ..
          
          if [ ! -f working_configs.json ]; then
            echo "[]" > working_configs.json
          fi
          
          COUNT=$(jq length working_configs.json)
          echo "✅ Working: $COUNT configs"
          echo "WORKING_COUNT=$COUNT" >> $GITHUB_ENV
      
      - name: Create empty configs if needed
        if: env.SCRAPED_COUNT == 0
        run: |
          echo "[]" > working_configs.json
          echo "WORKING_COUNT=0" >> $GITHUB_ENV
      
      - name: Generate files
        run: |
          cd src
          python utils.py
          cd ..
          
          echo "📂 Root files:"
          ls -lh *.html *.txt 2>/dev/null || echo "No files generated"
      
      - name: Prepare deployment
        run: |
          mkdir -p deploy
          
          # کپی فایل‌ها از root
          for file in subscription.txt index.html; do
            if [ -f "$file" ]; then
              cp "$file" deploy/
              echo "✅ Copied $file"
            else
              echo "⚠️ $file not found"
            fi
          done
          
          # ساخت فایل اطلاعات
          cat > deploy/last_update.txt << EOF
Last update: $(date '+%Y-%m-%d %H:%M:%S UTC')
Scraped: ${SCRAPED_COUNT:-0}
Working: ${WORKING_COUNT:-0}
EOF
          
          echo ""
          echo "📂 Deploy folder:"
          ls -lah deploy/
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
          commit_message: '🔄 Update: ${{ env.WORKING_COUNT }} configs'
      
      - name: Summary
        run: |
          echo "## 📊 Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🕐 Time: $(date '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- 📥 Scraped: ${SCRAPED_COUNT:-0}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Working: ${WORKING_COUNT:-0}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- Raw: https://raw.githubusercontent.com/balochscript/free-vpn-configs/gh-pages/subscription.txt" >> $GITHUB_STEP_SUMMARY
          echo "- Pages: https://balochscript.github.io/free-vpn-configs/" >> $GITHUB_STEP_SUMMARY
